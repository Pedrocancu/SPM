<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración Maestra | Nexus POS</title>

    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/all.css">
    <link rel="stylesheet" href="./css/sweetalert2.min.css">
    <script src="./js/sweetalert2.min.js"></script>

    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #06d6a0;
            --dark: #1e293b;
            --light: #f8fafc;
            --border: #e2e8f0;
        }

        body {
            background-color: #f1f5f9;
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--dark);
        }

        /* Layout Principal */
        .main-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .content-area {
            flex: 1;
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Cabecera Dinámica */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
            color: var(--primary);
        }

        /* Secciones de Configuración (Bento Grid) */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .config-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .config-card:hover {
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--light);
            padding-bottom: 15px;
        }

        .card-header i {
            width: 40px;
            height: 40px;
            background: var(--light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            margin-right: 15px;
        }

        /* Zona de Carga de Logo */
        .logo-upload-zone {
            border: 2px dashed var(--border);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .logo-upload-zone:hover {
            border-color: var(--primary);
            background: #f0f7ff;
        }

        #logo-preview {
            max-height: 120px;
            margin-bottom: 10px;
            display: none;
        }

        /* Inputs Estilizados */
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 8px;
        }

        .form-control-modern {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--light);
            transition: 0.3s;
        }

        .form-control-modern:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
        }

        /* Botón Flotante de Guardado */
        .save-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .btn-save-all {
            background: var(--primary);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 700;
            border: none;
            box-shadow: 0 10px 15px -3px rgba(67, 97, 238, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-save-all:hover {
            transform: scale(1.05);
            background: var(--secondary);
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="content-area">
            
            <header class="page-header">
                <div class="header-title">
                    <h1><i class="fas fa-cog fa-spin"></i> Configuración Global del Sistema</h1>
                    <small class="text-muted">Última actualización: Hoy a las 10:45 AM</small>
                </div>
                <div class="header-actions">
                    <span class="badge badge-pill badge-success p-2">Sincronizado con la Nube</span>
                </div>
            </header>

            <form id="masterConfigForm">
                <div class="settings-grid">
                    
                    <div class="config-card">
                        <div class="card-header">
                            <i class="fas fa-palette"></i>
                            <h5 class="m-0 font-weight-bold">Identidad Visual</h5>
                        </div>
                        <div class="logo-upload-zone" onclick="document.getElementById('logo-input').click()">
                            <input type="file" id="logo-input" hidden accept="image/*" onchange="previewImage(event)">
                            <img id="logo-preview" src="#" alt="Vista previa">
                            <div id="upload-placeholder">
                                <i class="fas fa-cloud-upload-alt fa-2x mb-2 text-primary"></i>
                                <p class="mb-0">Click para subir Logotipo</p>
                                <small class="text-muted">PNG o JPG (Max. 2MB)</small>
                            </div>
                        </div>
                        <div class="mt-4">
                            <label class="form-label">Eslogan de la Empresa</label>
                            <input type="text" class="form-control-modern" placeholder="Ej: Calidad que nos distingue">
                        </div>
                    </div>

                    <div class="config-card">
                        <div class="card-header">
                            <i class="fas fa-file-invoice-dollar"></i>
                            <h5 class="m-0 font-weight-bold">Configuración Fiscal</h5>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre Legal</label>
                                <input type="text" class="form-control-modern" value="Comercial Nexus S.R.L">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">RNC / NIT</label>
                                <input type="text" class="form-control-modern" value="131-45678-9">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Impuesto (ITBIS/IVA %)</label>
                                <input type="number" class="form-control-modern" value="18">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Moneda Sistema</label>
                                <select class="form-control-modern">
                                    <option>USD ($)</option>
                                    <option>DOP (RD$)</option>
                                    <option>MXN ($)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="config-card">
                        <div class="card-header">
                            <i class="fas fa-map-marked-alt"></i>
                            <h5 class="m-0 font-weight-bold">Contacto y Soporte</h5>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono Central</label>
                            <input type="tel" class="form-control-modern" placeholder="+1 (809) 000-0000">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Sitio Web</label>
                            <input type="url" class="form-control-modern" placeholder="https://tuempresa.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dirección Completa</label>
                            <textarea class="form-control-modern" rows="2"></textarea>
                        </div>
                    </div>

                </div>

                <div class="save-bar">
                    <button type="submit" class="btn-save-all">
                        <i class="fas fa-check-circle"></i> GUARDAR TODOS LOS CAMBIOS
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="./js/jquery-3.4.1.min.js"></script>
    <script>
        // Función para previsualizar el Logo
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('logo-preview');
                const placeholder = document.getElementById('upload-placeholder');
                output.src = reader.result;
                output.style.display = 'inline-block';
                placeholder.style.display = 'none';
            };
            reader.readAsDataURL(event.target.files[0]);
        }

        // Simulación de guardado masivo
        $('#masterConfigForm').on('submit', function(e) {
            e.preventDefault();
            Swal.fire({
                title: '¿Guardar configuración?',
                text: "Estos cambios se reflejarán en todos los puntos de venta y facturas",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#4361ee',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sí, aplicar todo',
                cancelButtonText: 'Revisar'
            }).then((result) => {
                if (result.value) {
                    Swal.fire({
                        title: 'Sincronizando...',
                        html: 'Actualizando base de datos global',
                        timer: 2000,
                        timerProgressBar: true,
                        onBeforeOpen: () => { Swal.showLoading(); }
                    }).then(() => {
                        Swal.fire('¡Éxito!', 'La configuración se ha aplicado correctamente.', 'success');
                    });
                }
            });
        });
    </script>
</body>
</html>
