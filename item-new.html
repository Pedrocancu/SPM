<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Item - Modern Pro</title>

    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/bootstrap-material-design.min.css">
    <link rel="stylesheet" href="./css/all.css">
    <link rel="stylesheet" href="./css/sweetalert2.min.css">
    <script src="./js/sweetalert2.min.js"></script>
    <link rel="stylesheet" href="./css/jquery.mCustomScrollbar.css">
    <link rel="stylesheet" href="./css/style.css">

    <style>
        /* Estilos Ultra Modernos */
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-color: #00d2ff;
        }

        .form-neon {
            background: #ffffff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .form-neon:hover {
            transform: translateY(-5px);
        }

        legend {
            font-weight: 700;
            color: #4a148c;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.2rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        /* Estilo para los Inputs */
        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 8px !important;
            padding: 10px 15px !important;
            border: 1px solid #e0e0e0 !important;
            transition: all 0.3s ease !important;
        }

        .form-control:focus {
            border-color: #764ba2 !important;
            box-shadow: 0 0 0 0.2rem rgba(118, 75, 162, 0.15) !important;
        }

        /* Botones Modernos */
        .btn-modern {
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-save {
            background: var(--primary-gradient);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
        }

        .btn-save:hover {
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.4);
            transform: scale(1.05);
            color: white;
        }

        .btn-clean {
            background: #f8f9fa;
            color: #666;
            border: 1px solid #ddd;
        }

        .btn-clean:hover {
            background: #e9ecef;
            color: #333;
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 38px;
            color: #ccc;
        }
    </style>
</head>

<body>
    <main class="full-box main-container">
        <section class="full-box nav-lateral">
            </section>

        <section class="full-box page-content">
            <nav class="full-box navbar-info">
                <a href="#" class="float-left show-nav-lateral"><i class="fas fa-exchange-alt"></i></a>
                <a href="user-update.html"><i class="fas fa-user-cog"></i></a>
                <a href="#" class="btn-exit-system"><i class="fas fa-power-off"></i></a>
            </nav>

            <div class="full-box page-header">
                <h3 class="text-left text-uppercase font-weight-bold">
                    <i class="fas fa-plus-circle fa-fw"></i> &nbsp; Nuevo Item
                </h3>
                <p class="text-justify text-muted">
                    Complete el siguiente formulario para registrar un nuevo artículo en el inventario. Asegúrese de que el código sea único.
                </p>
            </div>

            <div class="container-fluid">
                <ul class="full-box list-unstyled page-nav-tabs">
                    <li><a class="active" href="item-new.html"><i class="fas fa-plus fa-fw"></i> &nbsp; AGREGAR ITEM</a></li>
                    <li><a href="item-list.html"><i class="fas fa-clipboard-list fa-fw"></i> &nbsp; LISTA DE ITEMS</a></li>
                    <li><a href="item-search.html"><i class="fas fa-search fa-fw"></i> &nbsp; BUSCAR ITEM</a></li>
                </ul>
            </div>
            
            <div class="container-fluid">
                <form action="" class="form-neon" autocomplete="off">
                    <fieldset>
                        <legend><i class="fas fa-info-circle"></i> &nbsp; Información General</legend>
                        <div class="container-fluid">
                            <div class="row">
                                <div class="col-12 col-md-4">
                                    <div class="form-group">
                                        <label for="item_codigo" class="bmd-label-static">Código del Producto</label>
                                        <input type="text" pattern="[a-zA-Z0-9-]{1,45}" class="form-control" name="item_codigo" id="item_codigo" maxlength="45" placeholder="Ej: ART-001">
                                        <i class="fas fa-barcode input-icon"></i>
                                    </div>
                                </div>
                                
                                <div class="col-12 col-md-4">
                                    <div class="form-group">
                                        <label for="item_nombre" class="bmd-label-static">Nombre o Título</label>
                                        <input type="text" pattern="[a-zA-záéíóúÁÉÍÓÚñÑ0-9 ]{1,140}" class="form-control" name="item_nombre" id="item_nombre" maxlength="140" placeholder="Nombre descriptivo">
                                        <i class="fas fa-tag input-icon"></i>
                                    </div>
                                </div>

                                <div class="col-12 col-md-4">
                                    <div class="form-group">
                                        <label for="item_stock" class="bmd-label-static">Stock Inicial</label>
                                        <input type="number" class="form-control" name="item_stock" id="item_stock" placeholder="0">
                                        <i class="fas fa-boxes input-icon"></i>
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <div class="form-group">
                                        <label for="item_estado" class="bmd-label-static">Estado de Disponibilidad</label>
                                        <select class="form-control" name="item_estado" id="item_estado">
                                            <option value="" disabled>Seleccione una opción</option>
                                            <option selected value="Habilitado">✅ Habilitado para préstamo</option>
                                            <option value="Deshabilitado">🚫 Deshabilitado / Mantenimiento</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <div class="form-group">
                                        <label for="item_detalle" class="bmd-label-static">Detalles Adicionales</label>
                                        <input type="text" class="form-control" name="item_detalle" id="item_detalle" maxlength="190" placeholder="Marca, modelo, color...">
                                        <i class="fas fa-align-left input-icon"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </fieldset>

                    <div class="text-center mt-5">
                        <button type="reset" class="btn btn-modern btn-clean mr-md-3">
                            <i class="fas fa-eraser"></i> &nbsp; Limpiar Formulario
                        </button>
                        <button type="submit" class="btn btn-modern btn-save">
                            <i class="fas fa-save"></i> &nbsp; Guardar Producto
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="./js/jquery-3.4.1.min.js" ></script>
    <script src="./js/popper.min.js" ></script>
    <script src="./js/bootstrap.min.js" ></script>
    <script src="./js/jquery.mCustomScrollbar.concat.min.js" ></script>
    <script src="./js/bootstrap-material-design.min.js" ></script>
    <script>$(document).ready(function() { $('body').bootstrapMaterialDesign(); });</script>
    <script src="./js/main.js" ></script>
</body>
</html>
