<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Nuevo cliente</title>

    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/bootstrap-material-design.min.css">
    <link rel="stylesheet" href="./css/all.css">
    <link rel="stylesheet" href="./css/sweetalert2.min.css">
    <script src="./js/sweetalert2.min.js" ></script>
    <link rel="stylesheet" href="./css/jquery.mCustomScrollbar.css">
    <link rel="stylesheet" href="./css/style.css">

    <style>
        /* Modernización Global */
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-color: #00d2ff;
            --bg-body: #f0f2f5;
        }

        body {
            background-color: var(--bg-body);
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        /* Contenedor del Formulario Estilo Card Moderna */
        .form-neon-container {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.3);
            margin-bottom: 50px;
        }

        /* Estilo para Leyendas */
        legend {
            font-weight: 700;
            color: #4a4a4a;
            border-bottom: 2px solid var(--accent-color);
            width: auto;
            padding-right: 20px;
            margin-bottom: 30px;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        /* Campos de Entrada Mejorados */
        .form-group .form-control {
            border-radius: 8px;
            padding: 10px 15px;
            background: #f8f9fa;
            border: 1px solid #e1e4e8;
            transition: all 0.3s ease;
        }

        .form-group .form-control:focus {
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.2);
            border-color: var(--accent-color);
        }

        /* Botones Modernos */
        .btn-modern {
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-save {
            background: var(--primary-gradient);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.6);
            color: white;
        }

        .btn-reset {
            background: #e4e6eb;
            color: #4b4b4b;
            border: none;
        }

        .btn-reset:hover {
            background: #d8dadf;
            transform: translateY(-2px);
        }

        /* Pestañas de Navegación */
        .page-nav-tabs li a {
            border-radius: 12px !important;
            margin: 0 5px;
            font-weight: 600;
            transition: 0.3s;
        }

        .page-nav-tabs li a.active {
            background-color: #764ba2 !important;
            color: white !important;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
        }
    </style>
</head>
<body>
    
    <main class="full-box main-container">
        <section class="full-box nav-lateral">
            <div class="full-box nav-lateral-bg show-nav-lateral"></div>
            <div class="full-box nav-lateral-content">
                <figure class="full-box nav-lateral-avatar">
                    <i class="far fa-times-circle show-nav-lateral"></i>
                    <img src="./assets/avatar/Avatar.png" class="img-fluid" alt="Avatar">
                    <figcaption class="roboto-medium text-center">
                        Pedro Andres Cancu <br><small class="roboto-condensed-light">Web Developer</small>
                    </figcaption>
                </figure>
                <div class="full-box nav-lateral-bar"></div>
                <nav class="full-box nav-lateral-menu">
                    <ul>
                        <li><a href="home.html"><i class="fab fa-dashcube fa-fw"></i> Dashboard</a></li>
                        <li>
                            <a href="#" class="nav-btn-submenu"><i class="fas fa-users fa-fw"></i> Clientes <i class="fas fa-chevron-down"></i></a>
                            <ul>
                                <li><a href="client-new.html"><i class="fas fa-plus fa-fw"></i> Agregar Cliente</a></li>
                                <li><a href="client-list.html"><i class="fas fa-clipboard-list fa-fw"></i> Lista de clientes</a></li>
                                <li><a href="client-search.html"><i class="fas fa-search fa-fw"></i> Buscar cliente</a></li>
                            </ul>
                        </li>
                    </ul>
                </nav>
            </div>
        </section>

        <section class="full-box page-content">
            <nav class="full-box navbar-info">
                <a href="#" class="float-left show-nav-lateral"><i class="fas fa-exchange-alt"></i></a>
                <a href="user-update.html"><i class="fas fa-user-cog"></i></a>
                <a href="#" class="btn-exit-system"><i class="fas fa-power-off"></i></a>
            </nav>

            <div class="full-box page-header">
                <h3 class="text-left"><i class="fas fa-plus fa-fw"></i> &nbsp; AGREGAR CLIENTE</h3>
                <p class="text-justify text-muted">Complete todos los campos para registrar un nuevo cliente en el sistema.</p>
            </div>

            <div class="container-fluid">
                <ul class="full-box list-unstyled page-nav-tabs">
                    <li><a class="active" href="client-new.html"><i class="fas fa-plus fa-fw"></i> AGREGAR</a></li>
                    <li><a href="client-list.html"><i class="fas fa-clipboard-list fa-fw"></i> LISTA</a></li>
                    <li><a href="client-search.html"><i class="fas fa-search fa-fw"></i> BUSCAR</a></li>
                </ul>   
            </div>
            
            <div class="container-fluid">
                <div class="form-neon-container">
                    <form action="" autocomplete="off">
                        <fieldset>
                            <legend><i class="fas fa-user-circle"></i> &nbsp; Información Personal</legend>
                            <div class="container-fluid">
                                <div class="row">
                                    <div class="col-12 col-md-6">
                                        <div class="form-group">
                                            <label for="cliente_dni" class="bmd-label-floating text-primary font-weight-bold">DNI / Identificación</label>
                                            <input type="text" pattern="[a-zA-Z0-9-]{1,27}" class="form-control" name="cliente_dni" id="cliente_dni" maxlength="27">
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <div class="form-group">
                                            <label for="cliente_nombre" class="bmd-label-floating text-primary font-weight-bold">Nombre</label>
                                            <input type="text" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ ]{1,40}" class="form-control" name="cliente_nombre" id="cliente_nombre" maxlength="40">
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <div class="form-group">
                                            <label for="cliente_apellido" class="bmd-label-floating text-primary font-weight-bold">Apellido</label>
                                            <input type="text" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ ]{1,40}" class="form-control" name="cliente_apellido" id="cliente_apellido" maxlength="40">
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <div class="form-group">
                                            <label for="cliente_telefono" class="bmd-label-floating text-primary font-weight-bold">Teléfono</label>
                                            <input type="text" pattern="[0-9()+]{1,20}" class="form-control" name="cliente_telefono" id="cliente_telefono" maxlength="20">
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <div class="form-group">
                                            <label for="cliente_direccion" class="bmd-label-floating text-primary font-weight-bold">Dirección</label>
                                            <input type="text" pattern="[a-zA-Z0-9áéíóúÁÉÍÓÚñÑ#- ]{1,150}" class="form-control" name="cliente_direccion" id="cliente_direccion" maxlength="150">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </fieldset>
                        
                        <div class="text-center" style="margin-top: 50px;">
                            <button type="reset" class="btn btn-modern btn-reset">
                                <i class="fas fa-paint-roller"></i> &nbsp; LIMPIAR FORMULARIO
                            </button>
                            &nbsp; &nbsp;
                            <button type="submit" class="btn btn-modern btn-save">
                                <i class="far fa-save"></i> &nbsp; GUARDAR CLIENTE
                            </button>
                        </div>
                    </form>
                </div>
            </div>  

        </section>
    </main>
    
    <script src="./js/jquery-3.4.1.min.js" ></script>
    <script src="./js/popper.min.js" ></script>
    <script src="./js/bootstrap.min.js" ></script>
    <script src="./js/jquery.mCustomScrollbar.concat.min.js" ></script>
    <script src="./js/bootstrap-material-design.min.js" ></script>
    <script>$(document).ready(function() { $('body').bootstrapMaterialDesign(); });</script>
    <script src="./js/main.js" ></script>
</body>
</html>
