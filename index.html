<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | Animación Pro</title>

    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/all.css">
    <link rel="stylesheet" href="./css/sweetalert2.min.css">
    <script src="./js/sweetalert2.min.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --bg-dark: #0f172a;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* FONDO ANIMADO DE AURORAS */
        .aurora-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15), transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.15), transparent 40%);
            animation: auroraMove 20s infinite alternate ease-in-out;
        }

        @keyframes auroraMove {
            0% { transform: scale(1); }
            100% { transform: scale(1.2) rotate(5deg); }
        }

        /* TARJETA CON EFECTO DE VIDRIO Y ENTRADA ANIMADA */
        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ICONO CON PULSO INFINITO */
        .icon-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2.5rem;
            color: white;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(99, 102, 241, 0); }
            100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }

        /* INPUTS MODERNIZADOS */
        .form-group {
            position: relative;
            margin-bottom: 2rem;
            text-align: left;
        }

        .custom-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px 15px 15px 45px;
            color: white;
            transition: all 0.3s ease;
            outline: none;
        }

        .custom-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
            transform: translateX(5px);
        }

        .form-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            transition: color 0.3s ease;
        }

        .custom-input:focus + i {
            color: var(--primary);
        }

        /* BOTÓN CON EFECTO MAGNÉTICO (CSS) */
        .btn-login {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            letter-spacing: 4px;
            filter: brightness(1.1);
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
        }

        .btn-login::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: rgba(255,255,255,0.1);
            transform: rotate(45deg);
            transition: 0.5s;
            pointer-events: none;
        }

        .btn-login:hover::after {
            left: 120%;
        }

        .footer-info {
            margin-top: 2rem;
            color: #64748b;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="aurora-bg"></div>

    <div class="login-card" id="loginCard">
        <div class="icon-box">
            <i class="fas fa-lock-open"></i>
        </div>

        <h2 style="color: white; margin-bottom: 0.5rem; font-weight: 800;">NEXUS POS</h2>
        <p style="color: #94a3b8; margin-bottom: 2.5rem;">Introduzca sus llaves de acceso</p>

        <form id="animatedForm">
            <div class="form-group">
                <input type="text" class="custom-input" id="userInput" placeholder="Usuario" required>
                <i class="fas fa-user-shield"></i>
            </div>

            <div class="form-group">
                <input type="password" class="custom-input" id="passInput" placeholder="Contraseña" required>
                <i class="fas fa-key"></i>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                Acceder al Portal
            </button>
        </form>

        <div class="footer-info">
            &copy; 2026 Inteligencia de Negocios <br>
            <span style="color: var(--primary);">Secure Link Active</span>
        </div>
    </div>

    <script src="./js/jquery-3.4.1.min.js"></script>
    
    <script>
        $(document).ready(function() {
            // EFECTO DE MOVIMIENTO DE TARJETA (TILT)
            // La tarjeta se inclina ligeramente siguiendo el ratón
            $(document).on('mousemove', function(e) {
                let ax = -($(window).innerWidth() / 2 - e.pageX) / 40;
                let ay = ($(window).innerHeight() / 2 - e.pageY) / 40;
                $('#loginCard').css("transform", `rotateY(${ax}deg) rotateX(${ay}deg)`);
            });

            // VALIDACIÓN DE ACCESO
            $('#animatedForm').on('submit', function(e) {
                e.preventDefault();

                const u = $('#userInput').val();
                const p = $('#passInput').val();
                const btn = $('#loginBtn');

                // Animación visual de "procesando"
                btn.html('<i class="fas fa-circle-notch fa-spin"></i> Verificando...');
                btn.css('pointer-events', 'none');

                setTimeout(() => {
                    if(u === "admin" && p === "12345") {
                        Swal.fire({
                            title: '¡Acceso Concedido!',
                            text: 'Cargando módulos de seguridad...',
                            icon: 'success',
                            background: '#1e293b',
                            color: '#fff',
                            showConfirmButton: false,
                            timer: 1500
                        }).then(() => {
                            window.location.href = "home.html";
                        });
                    } else {
                        // Animación de error (Sacudida)
                        $('#loginCard').addClass('animated shake');
                        Swal.fire({
                            title: 'Error de Identidad',
                            text: 'Las credenciales no son válidas.',
                            icon: 'error',
                            background: '#1e293b',
                            color: '#fff',
                            confirmButtonColor: '#6366f1'
                        });
                        btn.html('Acceder al Portal');
                        btn.css('pointer-events', 'all');
                        
                        // Quitar clase de sacudida después de un segundo
                        setTimeout(() => $('#loginCard').removeClass('animated shake'), 1000);
                    }
                }, 1200);
            });
        });
    </script>
</body>
</html>
