<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>SISTEMA POS | Login Pro</title>

    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/bootstrap-material-design.min.css">
    <link rel="stylesheet" href="./css/all.css">
    <link rel="stylesheet" href="./css/sweetalert2.min.css">
    <script src="./js/sweetalert2.min.js"></script>
    <link rel="stylesheet" href="./css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.9);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Fondo de partículas */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            z-index: -1;
        }

        .login-card {
            background: var(--glass);
            width: 100%;
            max-width: 450px;
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        .logo-circle {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
        }

        .logo-circle i {
            color: white;
            font-size: 3rem;
        }

        .welcome-text h2 {
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .form-group {
            position: relative;
            margin-bottom: 35px !important;
        }

        .form-control {
            border: none !important;
            border-bottom: 2px solid #cbd5e1 !important;
            background: transparent !important;
            padding: 10px 5px !important;
            font-size: 1.1rem !important;
            color: #1e293b !important;
            transition: all 0.3s ease !important;
        }

        .form-control:focus {
            border-bottom-color: var(--primary) !important;
            box-shadow: none !important;
        }

        /* Toggle Password Eye */
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 35px;
            cursor: pointer;
            color: #64748b;
            z-index: 100;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%) !important;
            border: none !important;
            color: white !important;
            width: 100%;
            padding: 16px !important;
            border-radius: 12px !important;
            font-weight: 600 !important;
            font-size: 1.1rem !important;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease !important;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.4);
        }

        .footer-links {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #64748b;
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        /* Animación de entrada */
        .animate-in {
            animation: fadeInScale 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="login-card animate-in">
        <div class="logo-circle">
            <i class="fas fa-fingerprint"></i>
        </div>

        <div class="welcome-text text-center">
            <h2>Bienvenido</h2>
            <p class="text-muted">Inicia sesión para gestionar tu negocio</p>
        </div>

        <form id="proLoginForm" autocomplete="off">
            <div class="form-group">
                <label for="UserName" class="bmd-label-floating">
                    <i class="fas fa-user-circle"></i> &nbsp; Usuario Administrador
                </label>
                <input type="text" class="form-control" id="UserName" required>
            </div>

            <div class="form-group">
                <label for="UserPassword" class="bmd-label-floating">
                    <i class="fas fa-shield-alt"></i> &nbsp; Contraseña Segura
                </label>
                <input type="password" class="form-control" id="UserPassword" required>
                <span class="toggle-password" id="eyeIcon">
                    <i class="fas fa-eye"></i>
                </span>
            </div>

            <button type="submit" class="btn btn-submit" id="loginBtn">
                <span id="btnText">INGRESAR AHORA</span>
                <span id="loader" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Validando...</span>
            </button>

            <div class="footer-links">
                <span>¿Olvidaste tu clave? <a href="#">Click aquí</a></span>
            </div>
        </form>
    </div>

    <script src="./js/jquery-3.4.1.min.js"></script>
    <script src="./js/popper.min.js"></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/bootstrap-material-design.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <script>
        $(document).ready(function() {
            $('body').bootstrapMaterialDesign();

            // 1. Configuración de Partículas
            particlesJS('particles-js', {
                "particles": {
                    "number": { "value": 80 },
                    "color": { "value": "#6366f1" },
                    "shape": { "type": "circle" },
                    "opacity": { "value": 0.5 },
                    "size": { "value": 3 },
                    "line_linked": { "enable": true, "distance": 150, "color": "#6366f1", "opacity": 0.4, "width": 1 },
                    "move": { "enable": true, "speed": 2 }
                },
                "interactivity": {
                    "events": { "onhover": { "enable": true, "mode": "repulse" } }
                }
            });

            // 2. Toggle Mostrar/Ocultar Contraseña
            $('#eyeIcon').on('click', function() {
                const input = $('#UserPassword');
                const type = input.attr('type') === 'password' ? 'text' : 'password';
                input.attr('type', type);
                $(this).find('i').toggleClass('fa-eye fa-eye-slash');
            });

            // 3. Lógica de Autenticación
            $('#proLoginForm').on('submit', function(e) {
                e.preventDefault();
                
                const user = $('#UserName').val().trim();
                const pass = $('#UserPassword').val().trim();
                const btn = $('#loginBtn');

                // Simulación de carga
                $('#btnText').hide();
                $('#loader').show();
                btn.prop('disabled', true);

                setTimeout(() => {
                    if(user === "admin" && pass === "12345") {
                        Swal.fire({
                            title: '¡Acceso Concedido!',
                            text: 'Verificando credenciales en el servidor...',
                            icon: 'success',
                            background: '#fff',
                            timer: 2000,
                            showConfirmButton: false,
                            allowOutsideClick: false
                        }).then(() => {
                            window.location.href = "home.html";
                        });
                    } else {
                        Swal.fire({
                            title: 'Error de Seguridad',
                            text: 'El usuario o la clave no coinciden con nuestros registros.',
                            icon: 'error',
                            confirmButtonColor: '#6366f1'
                        });
                        $('#btnText').show();
                        $('#loader').hide();
                        btn.prop('disabled', false);
                    }
                }, 1500);
            });
        });
    </script>
</body>
</html>
